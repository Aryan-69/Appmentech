<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0B0E17}body{width:1200px;height:585px;background:#0B0E17;color:#fff;
  font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,161,60,.22) 0%,rgba(242,161,60,0) 62%);
  top:-320px;right:-260px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle,rgba(90,140,255,.16) 0%,rgba(90,140,255,0) 65%);
  bottom:-320px;left:-200px}
.wrap{position:relative;padding:52px 76px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px}
.brand span{font-size:34px;font-weight:700;letter-spacing:-.5px}
.dot{color:#F2A13C}
h1{font-size:52px;line-height:1.1;font-weight:700;letter-spacing:-1.6px;max-width:900px}
.accent{color:#F2A13C}
p{margin-top:18px;font-size:24px;line-height:1.45;color:#B9C0CF;max-width:860px}
.foot{display:flex;align-items:center;justify-content:space-between;font-size:22px;color:#8C94A6}
.chips{display:flex;gap:12px}
.chip{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:9px 20px;font-size:20px;color:#D7DCE6}
.rule{height:4px;width:120px;background:#F2A13C;border-radius:3px;margin-bottom:24px}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 120 120" width="56" height="56"><circle cx="60" cy="60" r="38" fill="#F2A13C"/><g fill="none" stroke="#F2A13C" stroke-width="9" stroke-linecap="round"><path d="M60 12 A48 48 0 0 1 102 36"/><path d="M60 108 A48 48 0 0 1 18 84"/></g><g fill="none" stroke="#0B0E17" stroke-linecap="butt"><path d="M60 38 L44 82" stroke-width="9"/><path d="M60 38 L76 82" stroke-width="9"/><path d="M50 68 L70 68" stroke-width="8"/></g></svg>
    <span>Appmentech<span class="dot">.</span></span>
  </div>
  <div>
    <div class="rule"></div>
    <h1>Custom Web, Mobile &amp; <span class="accent">AI</span><br>Development for Growing Businesses</h1>
    <p>India-based engineering team. Fixed scope, tested delivery, production-ready software.</p>
  </div>
  <div class="foot">
    <div class="chips"><span class="chip">Web</span><span class="chip">Mobile</span><span class="chip">AI &amp; GenAI</span><span class="chip">Cloud</span><span class="chip">QA</span></div>
    <span>appmentech.in</span>
  </div>
</div></body></html>
