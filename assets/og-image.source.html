<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* Source for assets/og-image.png. Render at exactly 1200x630 — that is the size
   declared in every page's og:image:width / og:image:height. */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#F7F9FB}body{width:1200px;height:630px;background:#F7F9FB;color:#0C1B26;
  font-family:"DejaVu Sans",Arial,Helvetica,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.34) 0%,rgba(56,189,248,0) 62%);
  top:-320px;right:-260px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;
  background:radial-gradient(circle,rgba(14,165,233,.20) 0%,rgba(14,165,233,0) 65%);
  bottom:-320px;left:-200px}
.wrap{position:relative;padding:56px 76px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px}
.brand span{font-size:34px;font-weight:700;letter-spacing:-.5px}
.dot{color:#0284C7}
h1{font-size:52px;line-height:1.1;font-weight:700;letter-spacing:-1.6px;max-width:920px}
.accent{color:#0284C7}
p{margin-top:18px;font-size:24px;line-height:1.45;color:#4C5C6B;max-width:880px}
.foot{display:flex;align-items:center;justify-content:space-between;font-size:22px;color:#6D7E8D}
.chips{display:flex;gap:12px}
.chip{border:1px solid rgba(56,189,248,.6);background:rgba(56,189,248,.12);border-radius:999px;
  padding:9px 20px;font-size:20px;color:#0369A1}
.rule{height:4px;width:120px;background:#38BDF8;border-radius:3px;margin-bottom:24px}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 120 120" width="56" height="56"><circle cx="60" cy="60" r="38" fill="#38BDF8"/><g fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"><path d="M60 12 A48 48 0 0 1 102 36"/><path d="M60 108 A48 48 0 0 1 18 84"/></g><g fill="none" stroke="#F7F9FB" stroke-linecap="butt"><path d="M60 38 L44 82" stroke-width="9"/><path d="M60 38 L76 82" stroke-width="9"/><path d="M50 68 L70 68" stroke-width="8"/></g></svg>
    <span>Appmentech<span class="dot">.</span></span>
  </div>
  <div>
    <div class="rule"></div>
    <h1>Websites and <span class="accent">CRM</span> Systems<br>That Run the Business Behind Them</h1>
    <p>Custom web and CRM development for Indian businesses. Written scope, fixed price, and you own the code.</p>
  </div>
  <div class="foot">
    <div class="chips"><span class="chip">Web</span><span class="chip">CRM</span><span class="chip">Portals</span><span class="chip">E-Commerce</span><span class="chip">Billing</span></div>
    <span>appmentech.in</span>
  </div>
</div></body></html>
